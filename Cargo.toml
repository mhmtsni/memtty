[package]
name = "terminal"
description = "A terminal emulator built with Rust and Iced."
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["tokio", "debug", "canvas"] }
portable-pty = "0.9.0"
tokio = { version = "1.50.0", features = ["full"] }
tokio-stream = "0.1.17"
vte = "0.15.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
