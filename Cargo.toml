[package]
name = "terminal"
description = "A terminal emulator built with Rust and wgpu."
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
bytemuck = { version = "1.24.0", features = ["derive"] }
glyphon = "0.10.0"
pollster = "0.4.0"
portable-pty = "0.9.0"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
vte = "0.15.0"
wgpu = "28.0.0"
winit = "0.30.13"

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.release]
codegen-units = 1
lto = true 
opt-level = 3
