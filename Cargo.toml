[package]
name = "terminal"
description = "A terminal emulator built with Rust and wgpu."
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
bytemuck = { version = "1.24.0", features = ["derive"] }
glyphon = "0.10.0"
pollster = "0.4.0"
portable-pty = "0.9.0"
vte = "0.15.0"
wgpu = { version = "28.0.0", default-features = false, features = ["metal"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.release]
codegen-units = 1
strip = true
lto = true 
debug = false
opt-level = 3 
panic = "abort"
incremental = false
